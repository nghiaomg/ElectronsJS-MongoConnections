<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ElectronsJS-MongoConnections</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="title-bar">
        <div class="title-bar-title">
            <i class="fas fa-database"></i>
            ElectronsJS-MongoConnections
        </div>
        <div class="title-bar-buttons">
            <button class="title-bar-button" id="minimizeBtn">
                <i class="fas fa-minus"></i>
            </button>
            <button class="title-bar-button" id="maximizeBtn">
                <i class="fas fa-expand"></i>
            </button>
            <button class="title-bar-button close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <div class="container">
        <div class="connection-section">
            <div class="connection-wrapper">
                <input type="text" id="connection-string" placeholder="MongoDB Connection String" value="mongodb://localhost:27017/">
                <div class="connection-history" id="connection-history"></div>
            </div>
            <button id="connect-button">
                <div id="loading-spinner" class="spinner" style="display: none;"></div>
                <span>Connect</span>
            </button>
            <div id="connection-error" class="error-message" style="display: none;"></div>
        </div>

        <div class="content">
            <div class="sidebar">
                <div id="database-list"></div>
                <div id="collection-list"></div>
            </div>

            <div class="main-content">
                <div class="document-header hidden-before-collection">
                    <div class="header-left">
                        <h2 id="current-collection-name"></h2>
                        <button id="reload-btn" class="icon-btn">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="header-right">
                        <button id="new-document-btn" class="primary-btn">
                            <i class="fas fa-plus"></i> New Document
                        </button>
                        <div class="view-toggle">
                            <button id="table-view-btn" class="active">
                                <i class="fas fa-table"></i>
                            </button>
                            <button id="json-view-btn">
                                <i class="fas fa-code"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="document-view"></div>
            </div>
        </div>
    </div>

    <div id="modal-container" class="modal">
        <div class="modal-content"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <script>
        // Add window control event listeners
        const minimizeBtn = document.getElementById('minimizeBtn');
        const maximizeBtn = document.getElementById('maximizeBtn');
        const closeBtn = document.getElementById('closeBtn');
        const maximizeIcon = maximizeBtn.querySelector('i');

        minimizeBtn.addEventListener('click', () => {
            window.electronAPI.minimizeWindow();
        });
        
        maximizeBtn.addEventListener('click', () => {
            window.electronAPI.maximizeWindow();
        });
        
        closeBtn.addEventListener('click', () => {
            window.electronAPI.closeWindow();
        });

        // Handle window maximize/restore events
        window.electronAPI.onMaximize(() => {
            maximizeIcon.classList.remove('fa-expand');
            maximizeIcon.classList.add('fa-compress');
        });

        window.electronAPI.onUnmaximize(() => {
            maximizeIcon.classList.remove('fa-compress');
            maximizeIcon.classList.add('fa-expand');
        });

        // Add double click to title bar for maximize/restore
        const titleBar = document.querySelector('.title-bar');
        titleBar.addEventListener('dblclick', (e) => {
            // Prevent double click on buttons
            if (!e.target.closest('.title-bar-buttons')) {
                window.electronAPI.maximizeWindow();
            }
        });
    </script>
</body>

</html>
